name: PimsOS CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:

  test:

    name: PowerShell CI

    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:

      # --------------------------------------------------
      # Repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # PowerShell
      # --------------------------------------------------

      - name: Display PowerShell version
        run: |
          $PSVersionTable

      # --------------------------------------------------
      # Modules
      # --------------------------------------------------

      - name: Install required modules
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted

          Install-Module Pester `
            -RequiredVersion 5.8.0 `
            -Force `
            -SkipPublisherCheck

          Install-Module PSScriptAnalyzer `
            -Force `
            -SkipPublisherCheck

      # --------------------------------------------------
      # PimsOS module
      # --------------------------------------------------

      - name: Verify PimsOS module
        run: |
          $Manifest = Join-Path $PWD "Modules\PimsOS.psd1"

          if (-not (Test-Path $Manifest)) {
              throw "Module manifest not found: $Manifest"
          }

          Import-Module `
            $Manifest `
            -Force `
            -ErrorAction Stop

          $Module = Get-Module PimsOS

          if ($null -eq $Module) {
              throw "PimsOS module was not loaded."
          }

          Write-Host "Module imported successfully."
          Write-Host "Version : $($Module.Version)"

      # --------------------------------------------------
      # Script Analyzer
      # --------------------------------------------------

      - name: Run PSScriptAnalyzer
        run: |
          $Results = Invoke-ScriptAnalyzer `
            -Path Modules `
            -Recurse `
            -Severity Error

          if ($Results) {
              $Results | Format-Table -AutoSize
              throw "PSScriptAnalyzer detected errors."
          }

          Write-Host "PSScriptAnalyzer : OK"

      # --------------------------------------------------
      # Pester Unit Tests
      # --------------------------------------------------

      - name: Run Pester unit tests
        run: |
          $Result = Invoke-Pester `
            -Path Tests\Unit `
            -CI `
            -Output Detailed `
            -PassThru

          if ($Result.FailedCount -gt 0) {
              throw "Pester detected $($Result.FailedCount) failing test(s)."
          }

          Write-Host "Pester unit tests : OK"

      # --------------------------------------------------
      # Test results
      # --------------------------------------------------

      - name: Generate Pester test report
        if: always()
        run: |
          Invoke-Pester `
            -Path Tests\Unit `
            -Output Normal `
            -OutputFormat NUnitXml `
            -OutputFile Tests\Pester-TestResults.xml

      # --------------------------------------------------
      # Upload test results
      # --------------------------------------------------

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-test-results
          path: Tests\Pester-TestResults.xml
          if-no-files-found: warn