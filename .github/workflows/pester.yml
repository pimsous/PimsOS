name: PimsOS CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:

  test:

    name: PowerShell CI

    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:

      # --------------------------------------------------
      # Repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

      # --------------------------------------------------
      # PowerShell
      # --------------------------------------------------

      - name: Display PowerShell version
        run: |
          $PSVersionTable

      # --------------------------------------------------
      # Modules
      # --------------------------------------------------

      - name: Install required modules
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted

          Install-Module Pester `
            -RequiredVersion 5.8.0 `
            -Force `
            -SkipPublisherCheck

          Install-Module PSScriptAnalyzer `
            -Force `
            -SkipPublisherCheck

      # --------------------------------------------------
      # PimsOS module
      # --------------------------------------------------

      - name: Verify PimsOS module
        run: |
          $Manifest = Join-Path $PWD "Modules\PimsOS.psd1"

          if (-not (Test-Path $Manifest)) {
              throw "Module manifest not found: $Manifest"
          }

          Import-Module `
            $Manifest `
            -Force `
            -ErrorAction Stop

          $Module = Get-Module PimsOS

          if ($null -eq $Module) {
              throw "PimsOS module was not loaded."
          }

          Write-Host "Module imported successfully."
          Write-Host "Version : $($Module.Version)"

      # --------------------------------------------------
      # Script Analyzer
      # --------------------------------------------------

      - name: Run PSScriptAnalyzer
        run: |
          $Results = Invoke-ScriptAnalyzer `
            -Path Modules `
            -Recurse `
            -Severity Error

          if ($Results) {
              $Results | Format-Table -AutoSize
              throw "PSScriptAnalyzer detected errors."
          }

          Write-Host "PSScriptAnalyzer : OK"

      # --------------------------------------------------
      # Pester Unit Tests
      # --------------------------------------------------

      - name: Run Pester unit tests
        run: |
          $Config = New-PesterConfiguration

          $Config.Run.Path = "Tests\Unit"
          $Config.Run.Exit = $false
          $Config.Run.PassThru = $true

          $Config.Output.Verbosity = "Detailed"

          $Result = Invoke-Pester `
            -Configuration $Config

          if ($Result.FailedCount -gt 0) {
              throw "Pester detected $($Result.FailedCount) failing unit test(s)."
          }

          Write-Host "Pester unit tests : OK"

      # --------------------------------------------------
      # Pester Integration Tests
      # --------------------------------------------------

      - name: Run Pester integration tests
        run: |
          $Config = New-PesterConfiguration

          $Config.Run.Path = "Tests\Integration"
          $Config.Run.Exit = $false
          $Config.Run.PassThru = $true

          $Config.Output.Verbosity = "Detailed"

          $Result = Invoke-Pester `
            -Configuration $Config

          if ($Result.FailedCount -gt 0) {
              throw "Pester detected $($Result.FailedCount) failing integration test(s)."
          }

          Write-Host "Pester integration tests : OK"

      # --------------------------------------------------
      # Test results - Unit
      # --------------------------------------------------

      - name: Generate Pester unit test report
        if: always()
        run: |
          $Config = New-PesterConfiguration

          $Config.Run.Path = "Tests\Unit"

          $Config.Output.Verbosity = "Normal"

          $Config.TestResult.Enabled = $true
          $Config.TestResult.OutputFormat = "NUnitXml"
          $Config.TestResult.OutputPath = "Tests\Pester-Unit-TestResults.xml"

          Invoke-Pester `
            -Configuration $Config `
            -ErrorAction Stop

      # --------------------------------------------------
      # Test results - Integration
      # --------------------------------------------------

      - name: Generate Pester integration test report
        if: always()
        run: |
          $Config = New-PesterConfiguration

          $Config.Run.Path = "Tests\Integration"

          $Config.Output.Verbosity = "Normal"

          $Config.TestResult.Enabled = $true
          $Config.TestResult.OutputFormat = "NUnitXml"
          $Config.TestResult.OutputPath = "Tests\Pester-Integration-TestResults.xml"

          Invoke-Pester `
            -Configuration $Config `
            -ErrorAction Stop

      # --------------------------------------------------
      # Upload test results
      # --------------------------------------------------

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-test-results
          path: |
            Tests\Pester-Unit-TestResults.xml
            Tests\Pester-Integration-TestResults.xml
          if-no-files-found: warn
